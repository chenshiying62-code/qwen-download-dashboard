<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>型号详情</title><style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#17202a;--muted:#667085;--line:#d9e1e8;
--brand:#3157d5;--soft:#eef2ff;--good:#08785b;--warn:#9a6700;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);
font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1500px;margin:auto;padding:28px}h1{font-size:28px;margin:0 0 8px}
h2{font-size:20px;margin:0 0 14px}.lede,.muted{color:var(--muted)}
.notice{background:var(--soft);border:1px solid #cdd7ff;border-radius:10px;padding:12px 16px;margin:18px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:18px 0;padding:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stat{background:#f8fafc;border-radius:8px;padding:12px}.stat b{display:block;font-size:20px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
label{display:grid;gap:4px;color:var(--muted);font-size:12px}
input,select,button{background:#fff;border:1px solid #b8c3cf;border-radius:6px;
min-height:36px;padding:6px 9px;font:inherit}input[type=search]{min-width:min(360px,80vw)}
.table-wrap{overflow:auto}table{border-collapse:collapse;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top;max-width:420px;word-break:break-word}
th{background:#f8fafc;position:sticky;top:0;white-space:nowrap;z-index:1}
th[data-sort]{cursor:pointer}.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;border-radius:999px;background:#eef2f6;padding:2px 8px;white-space:nowrap}
.main{background:#e6f6f1;color:var(--good)}.eco{background:#fff7e6;color:var(--warn)}
.excluded{background:#fff0ee;color:var(--bad)}.pager{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.topline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.back{margin-left:auto}
@media(max-width:700px){.wrap{padding:16px}.panel{padding:14px}}
</style></head>
<body><main class="wrap"><div class="topline"><div><h1 id="title">加载中</h1><p id="subtitle" class="lede"></p></div>
<a class="back" href="index.html">返回完整榜</a></div><p id="error" class="muted"></p><section id="stats" class="panel stats"></section>
<section class="panel"><h2>全部变体与来源</h2><div class="controls"><label>搜索
<input id="search" type="search" placeholder="作者、仓库、证据"></label><label>平台<select id="platform"><option value="">全部</option></select></label>
<label>分档<select id="tier"><option value="">全部</option></select></label><label>关系<select id="relation"><option value="">全部</option></select></label>
<label>每页<select id="size"><option>50</option><option selected>100</option><option>250</option></select></label></div>
<div class="table-wrap"><table><thead><tr><th>平台</th><th>发布者</th><th>仓库</th><th>变体</th><th>分档</th><th>关系</th>
<th>累计计数</th><th>证据</th><th>理由</th><th>来源</th><th>计数来源</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pager"><span id="status"></span><div><button id="prev">上一页</button> <button id="next">下一页</button></div></div>
</section></main><script>
const id=new URLSearchParams(location.search).get('id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const source=(v,label)=>{const m=String(v??'').match(/https?:\/\/\S+/);return m?`<a target="_blank" rel="noopener" href="${esc(m[0])}">${label}</a>`:esc(v)};
Promise.all([fetch('manifest.json').then(r=>r.json()),fetch(`data/${encodeURIComponent(id)}.jsonl`).then(r=>r.text())]).then(([manifest,text])=>{
const meta=manifest.models[id],fields=manifest.fields,ix=Object.fromEntries(fields.map((f,i)=>[f,i]));
const rows=text.trim()?text.trim().split('\n').map(JSON.parse):[];document.title=`${meta.model} · Qwen下载排行`;
document.querySelector('#title').textContent=meta.model;document.querySelector('#subtitle').textContent=`确认主榜第${meta.rank}名 · ${rows.length.toLocaleString()}条来源`;
document.querySelector('#stats').innerHTML=[['总下载量',meta.total],['官方',meta.official],['第三方变体',meta.third],['待核',meta.pending],['含待核',meta.expanded],['生态附录',meta.ecosystem]].map(x=>`<div class="stat"><b>${Number(x[1]).toLocaleString()}</b><span class="muted">${x[0]}</span></div>`).join('');
const q=document.querySelector('#search'),platform=document.querySelector('#platform'),tier=document.querySelector('#tier'),relation=document.querySelector('#relation'),size=document.querySelector('#size');
function options(el,key){[...new Set(rows.map(r=>String(r[ix[key]]??'')))].sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o)})}
options(platform,'平台');options(tier,'分档');options(relation,'关系');let page=1;
function render(){const needle=q.value.trim().toLowerCase(),filtered=rows.filter(r=>{const hay=r.map(String).join('\n').toLowerCase();
return(!needle||hay.includes(needle))&&(!platform.value||r[ix['平台']]===platform.value)&&(!tier.value||r[ix['分档']]===tier.value)&&(!relation.value||r[ix['关系']]===relation.value)});
const n=Number(size.value),pages=Math.max(1,Math.ceil(filtered.length/n));page=Math.min(page,pages);const start=(page-1)*n;
document.querySelector('#rows').innerHTML=filtered.slice(start,start+n).map(r=>`<tr><td>${esc(r[ix['平台']])}</td><td>${esc(r[ix['发布者']])}</td>
<td class="repo">${esc(r[ix['仓库']])}</td><td>${esc(r[ix['变体']])}</td><td>${esc(r[ix['分档']])}</td><td>${esc(r[ix['关系']])}</td>
<td class="num">${Number(r[ix['累计计数']]||0).toLocaleString()}</td><td>${esc(r[ix['证据']])}</td><td>${esc(r[ix['理由']])}</td>
<td>${source(r[ix['仓库来源链接']],'仓库')}</td><td>${source(r[ix['计数来源接口']],'计数')}</td></tr>`).join('');
document.querySelector('#status').textContent=filtered.length?`${start+1}–${Math.min(start+n,filtered.length)} / ${filtered.length}条（第${page}/${pages}页）`:'0条';
document.querySelector('#prev').disabled=page<=1;document.querySelector('#next').disabled=page>=pages}
[q,platform,tier,relation,size].forEach(x=>x.addEventListener(x===q?'input':'change',()=>{page=1;render()}));
document.querySelector('#prev').onclick=()=>{page--;render()};document.querySelector('#next').onclick=()=>{page++;render()};render();
}).catch(error=>document.querySelector('#error').textContent=`加载失败：${error.message}`);
</script></body></html>
